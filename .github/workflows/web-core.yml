name: Web core

on:
  push:
    branches:
      - multicamera-concept
    paths:
      - "core/**"
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/web-core.yml"
  pull_request:
    paths:
      - "core/**"
      - "schemas/**"
      - "tests/**"
      - ".github/workflows/web-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test project package
        run: node --test tests/uizador-package.test.mjs
