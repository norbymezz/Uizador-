<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uizador · Efectos</title><style>
:root{color-scheme:dark;--p:#ff79bd;--v:#a98cff;--ink:#fff8fc;--muted:#c4b8ca}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 82% 0,#47265f 0,#21142f 40%,#0d0a14 82%);color:var(--ink);font-family:system-ui,sans-serif}main{width:min(900px,100%);margin:auto;padding:16px}
header{display:flex;align-items:center;gap:10px}header a{font-size:1.7rem;color:#fff;text-decoration:none}h1{font-size:1.35rem}
.card{border:1px solid #4d3b57;border-radius:16px;background:rgba(34,23,45,.9);padding:14px;margin-top:11px}.time{font-size:2rem;font-variant-numeric:tabular-nums;text-align:center}
input,button,select{width:100%;min-height:43px;border:1px solid #5a4666;border-radius:10px;background:#21172b;color:#fff;padding:8px;font:inherit}button{cursor:pointer;font-weight:750}
.tabs{display:flex;gap:6px;overflow:auto;margin-top:11px}.tab{width:auto;white-space:nowrap;border-radius:99px;padding:8px 12px}.tab.on,.primary{background:linear-gradient(135deg,#e84f9a,#8568df)}
.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:11px}.effect{min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:#2b1c36}.effect span{font-size:1.65rem}.effect small{color:var(--muted)}
.list{display:grid;gap:7px}.item{display:grid;grid-template-columns:76px 1fr 38px;gap:8px;align-items:center;border-bottom:1px solid #43334c;padding:9px 0}.item time{color:var(--p);font-weight:800}.item small{display:block;color:var(--muted);margin-top:3px}.empty{color:var(--muted);text-align:center;padding:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:600px){.palette{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
</style></head><body><main><header><a href="../app-home/index.html">‹</a><h1>Efectos y sobreimpresiones</h1></header>
<section class="card"><div class="time" id="time">00:05.0</div><input id="scrub" type="range" min="0" max="30" step=".1" value="5"><div class="grid" style="margin-top:9px"><label>Duración del proyecto<input id="duration" type="number" min="1" max="600" value="30"></label><label>Duración del efecto<input id="effectDuration" type="number" min=".1" max="30" step=".1" value="2"></label></div></section>
<div class="tabs"><button class="tab on" data-cat="sound">Sonidos</button><button class="tab" data-cat="overlay">Sobreimpresión</button><button class="tab" data-cat="transition">Transiciones</button></div>
<section class="card"><div id="palette" class="palette"></div><div class="grid" style="margin-top:10px"><input id="customText" placeholder="Texto o nombre del recurso"><input id="customFile" type="file" accept="audio/*,image/*"></div></section>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:22px"><strong>Timeline de efectos</strong><button id="export" style="width:auto">Exportar JSON</button></div><section id="list" class="card list"></section>
</main><script>
const $=s=>document.querySelector(s);let cat='sound',items=[];const defs={
sound:[['🚑','Sirena','siren'],['👏','Aplausos','applause'],['🐈','Gato','cat'],['✨','Brillo','sparkle']],
overlay:[['💬','Texto','text'],['★','Sticker','sticker'],['▣','Imagen','image'],['©','Crédito','credit']],
transition:[['↔','Deslizamiento','slide'],['◐','Fundido','fade'],['⚡','Flash','flash'],['◎','Zoom','zoom']]
};
function fmt(t){return'00:'+Number(t).toFixed(1).padStart(4,'0')}function renderPalette(){const p=$('#palette');p.innerHTML='';defs[cat].forEach(d=>{const b=document.createElement('button');b.className='effect';b.innerHTML='<span>'+d[0]+'</span><strong>'+d[1]+'</strong><small>'+(cat==='sound'?'Tocar para escuchar':'Agregar en '+fmt($('#scrub').value))+'</small>';b.onclick=()=>{if(cat==='sound')sound(d[2]);add(d[2],d[1])};p.appendChild(b)})}
function add(kind,label){const custom=$('#customText').value.trim();items.push({id:crypto.randomUUID(),type:cat,kind,label:custom||label,start_sec:+$('#scrub').value,duration_sec:+$('#effectDuration').value});renderList()}
function renderList(){const b=$('#list');b.innerHTML='';if(!items.length){b.innerHTML='<div class="empty">Todavía no agregaste efectos.</div>';return}items.sort((a,b)=>a.start_sec-b.start_sec).forEach(x=>{const e=document.createElement('div');e.className='item';e.innerHTML='<time>'+fmt(x.start_sec)+'</time><div><strong>'+x.label+'</strong><small>'+x.type+' · '+x.duration_sec+' s</small></div><button>×</button>';e.querySelector('button').onclick=()=>{items=items.filter(i=>i.id!==x.id);renderList()};b.appendChild(e)})}
let ac;function audio(){return ac=ac||new AudioContext()}function osc(f,t=.3,type='sine',delay=0){const a=audio(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+delay);g.gain.setValueAtTime(.001,a.currentTime+delay);g.gain.exponentialRampToValueAtTime(.3,a.currentTime+delay+.01);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+delay+t);o.connect(g).connect(a.destination);o.start(a.currentTime+delay);o.stop(a.currentTime+delay+t+.02)}
function sound(k){if(k==='siren'){for(let i=0;i<6;i++){osc(i%2?880:620,.34,'sine',i*.28)}}else if(k==='applause'){for(let i=0;i<12;i++)osc(160+Math.random()*900,.08,'square',i*.06)}else if(k==='cat'){osc(620,.45);setTimeout(()=>osc(880,.35),220)}else{osc(1250,.12);setTimeout(()=>osc(1750,.18),100)}}
$('#scrub').oninput=()=>$('#time').textContent=fmt($('#scrub').value);$('#duration').onchange=()=>{$('#scrub').max=$('#duration').value};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));renderPalette()});
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({schema:'uizador.effects.v0.1',duration_sec:+$('#duration').value,effects:items},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='uizador-effects.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
renderPalette();renderList();
</script></body></html>
