<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uizador · Presets</title><style>
:root{color-scheme:dark;--pink:#ff79bd;--purple:#a98cff;--cyan:#58dce0;--ink:#fff8fc;--muted:#c4b9ca}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#482461 0,#21142f 40%,#0e0a16 82%);color:var(--ink);font-family:system-ui,sans-serif}
main{width:min(1050px,100%);margin:auto;padding:16px}h1{font-size:1.4rem;margin:4px 0}header p{color:var(--muted);margin:6px 0 18px}
.filters{display:flex;gap:7px;overflow:auto;padding-bottom:6px}.filter{width:auto;white-space:nowrap;border:1px solid #5b4869;background:#281a35;color:#fff;border-radius:99px;padding:8px 13px}.filter.on{background:linear-gradient(135deg,#e84f9a,#8568df)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:15px}.card{position:relative;min-height:250px;border:1px solid #4a3956;border-radius:18px;overflow:hidden;background:linear-gradient(150deg,rgba(65,38,78,.95),rgba(24,18,35,.96));padding:18px;display:flex;flex-direction:column}
.visual{height:88px;position:relative;margin-bottom:14px}.figure{--figure:var(--pink);position:absolute;top:0;width:54px;height:88px;filter:drop-shadow(0 4px 5px #0008)}.figure.a{left:13%}.figure.b{right:13%;--figure:var(--cyan)}.figure-fill{fill:var(--figure);fill-opacity:.18;stroke:var(--figure);stroke-width:7}.figure-limb{fill:none;stroke:var(--figure);stroke-width:22;stroke-linecap:round}.figure-shoe{fill:var(--figure);opacity:.72}.arrow{position:absolute;z-index:2;inset:26px 0 auto;text-align:center;color:#ffc774;font-size:28px;text-shadow:0 2px 5px #0e0a16}
.card h2{font-size:1.08rem;margin:0 0 7px}.card p{color:var(--muted);font-size:.86rem;line-height:1.4;margin:0 0 14px}.meta{font-size:.76rem;color:#e9cbea;margin-top:auto}.actions{display:grid;grid-template-columns:1fr 42px;gap:7px;margin-top:11px}
button,a{min-height:42px;border:1px solid #684f76;border-radius:10px;background:#2c1d38;color:#fff;padding:9px;text-decoration:none;font:inherit;font-weight:700;text-align:center;cursor:pointer}.start{background:linear-gradient(135deg,#e84f9a,#8568df)}.fav.on{color:#ff87c4;background:#4b2548}
.empty{display:none;text-align:center;color:var(--muted);padding:70px 10px}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body><main><header><h1>Choose how you want to tell it</h1><p>Ready-made scenes you can adapt with your cast, words, and setting.</p></header>
<div class="filters"><button class="filter on" data-filter="all">All</button><button class="filter" data-filter="one">1 phone</button><button class="filter" data-filter="multi">Multiple phones</button><button class="filter" data-filter="dialogue">Dialogue</button><button class="filter" data-filter="movement">Movement</button><button class="filter" data-filter="montage">Montage</button><button class="filter" data-filter="fantasy">Fantasy</button><button class="filter" data-filter="music">Music</button><button class="filter" data-filter="news">News & shows</button><button class="filter" data-filter="remote">Remote</button><button class="filter" data-filter="fav">Favorites</button></div>
<section class="grid" id="grid"></section><div class="empty" id="empty">There are no presets in this filter yet.</div>
</main><script>
const scenes=[
{id:'two',title:'Two-shot push-in',desc:'Two people share the frame while the camera moves gradually closer.',tags:['one','multi','dialogue'],phones:'1 or more',move:'↔'},
{id:'reverse',title:'Shot / reverse shot',desc:'Two people face each other while A and B alternate across a consistent 180° line.',tags:['one','multi','dialogue'],phones:'Ideal: 2',move:'A ⇆ B'},
{id:'moveab',title:'Move from A to B',desc:'Start and finish marks show the route and timing during the take.',tags:['one','multi','movement'],phones:'1 or more',move:'A → B'},
{id:'followback',title:'Follow from behind',desc:'The camera follows the subject from behind while preserving distance and height.',tags:['one','multi','movement'],phones:'1 or more',move:'↑ behind'},
{id:'walkfront',title:'Front tracking walk',desc:'The subject walks forward while the camera moves backward and holds the framing.',tags:['one','multi','movement'],phones:'1 or more',move:'↓ camera'},
{id:'walktalk',title:'Walk and talk',desc:'Two people hold a conversation while the camera travels with them.',tags:['one','multi','dialogue','movement'],phones:'1 or more',move:'A+B →'},
{id:'sitcom',title:'Multicamera sitcom',desc:'Wide shot, character A, and character B coverage for one continuous performance.',tags:['one','multi','dialogue'],phones:'Ideal: 3',move:'A · W · B'},
{id:'breaking-news',title:'Breaking News',desc:'Ready-made anchor, split interview, reporter, and return shots with editable live graphics.',tags:['multi','dialogue','news','remote'],phones:'Ideal: 2',move:'▣ LIVE',href:'../sync-preview/index.html?preset=breaking-news'},
{id:'video-podcast',title:'Video Podcast',desc:'A two-shot plus host and guest close-ups, show title, episode title, and lower thirds.',tags:['multi','dialogue','news','remote'],phones:'Ideal: 2',move:'A │ B',href:'../sync-preview/index.html?preset=video-podcast'},
{id:'interview',title:'Remote interview',desc:'Two people record separately with a shared duration and script for later assembly.',tags:['multi','dialogue','news','remote'],phones:'Ideal: 2',move:'A │ B',href:'../news-studio/index.html?template=interview'},
{id:'orbit',title:'Orbit the subject',desc:'The camera rotates around the center while the action continues.',tags:['one','multi','movement'],phones:'1 or more',move:'⟳'},
{id:'montage',title:'Short montage',desc:'Wide, medium action, detail, and reaction shots compress a sequence.',tags:['one','multi','montage'],phones:'1 or more',move:'W · M · D · R'},
{id:'fantasy',title:'Illustrated world',desc:'A guided performance designed for a drawn or fantasy background added later.',tags:['one','multi','fantasy','movement'],phones:'1 or more',move:'◇ background',theme:'pastel'},
{id:'choreography',title:'Music choreography',desc:'Guide audio marks steps, entrances, and movements; the final soundtrack can be added later.',tags:['one','multi','movement','music'],phones:'1 or more',move:'♪'},
{id:'chroma',title:'Chroma scene',desc:'Framing prepared for a background replacement during later editing.',tags:['one','multi','movement'],phones:'1 or more',move:'◇'}
];
function humanFigure(position){return `<svg class="figure ${position}" viewBox="-115 -355 230 380" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g>
<path class="figure-limb" d="M-34 -206 Q-56 -178 -44 -140 Q-33 -117 -12 -111"/><path class="figure-limb" d="M34 -206 Q56 -178 44 -140 Q33 -117 12 -111"/>
<path class="figure-limb" d="M-18 -95 L-25 0"/><path class="figure-limb" d="M18 -95 L26 0"/><ellipse class="figure-shoe" cx="-34" cy="8" rx="23" ry="8"/><ellipse class="figure-shoe" cx="38" cy="8" rx="23" ry="8"/>
<path class="figure-fill" d="M-44 -225 Q0 -248 44 -225 L36 -96 L-36 -96 Z"/><path class="figure-fill" d="M-13 -242 L-13 -258 L13 -258 L13 -242 Z"/><circle class="figure-fill" cx="0" cy="-301" r="52"/>
</g></svg>`}
let active='all';const favs=new Set(JSON.parse(localStorage.getItem('uizador-favs')||'[]'));
function key(s,i){return s.title+'-'+i}
function render(){const box=document.querySelector('#grid');box.innerHTML='';let count=0;scenes.forEach((s,i)=>{const k=key(s,i),show=active==='all'||(active==='fav'?favs.has(k):s.tags.includes(active));if(!show)return;count++;const href=s.href||'../scene-rehearsal/index.html?preset='+s.id+'&theme='+(s.theme||'pop'),e=document.createElement('article');e.className='card';e.innerHTML=`<div class="visual">${humanFigure('a')}<span class="arrow">${s.move}</span>${humanFigure('b')}</div><h2>${s.title}</h2><p>${s.desc}</p><div class="meta">📱 ${s.phones}</div><div class="actions"><a class="start" href="${href}">Use preset</a><button class="fav ${favs.has(k)?'on':''}" aria-label="Favorite">♥</button></div>`;e.querySelector('.fav').onclick=()=>{favs.has(k)?favs.delete(k):favs.add(k);localStorage.setItem('uizador-favs',JSON.stringify([...favs]));render()};box.appendChild(e)});document.querySelector('#empty').style.display=count?'none':'block'}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{active=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('on',x===b));render()});render();
</script></body></html>
