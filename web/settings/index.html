<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uizador · Preferencias</title>
<style>:root{color-scheme:dark;--p:#ff79bd;--v:#a98cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 82% 0,#47265f 0,#21142f 40%,#0d0a14 82%);color:#fff8fc;font-family:system-ui,sans-serif}main{width:min(650px,100%);margin:auto;padding:16px}header{display:flex;gap:10px;align-items:center}header a{color:#fff;text-decoration:none;font-size:1.8rem}h1{font-size:1.35rem}.card{border:1px solid #4e3c58;border-radius:16px;background:rgba(35,24,46,.91);padding:14px;margin-top:12px}.card h2{font-size:.88rem;color:#c5b8ca;margin:0 0 12px}label{display:grid;gap:5px;color:#c9bdcf;font-size:.83rem;margin-bottom:12px}select,input,button{width:100%;min-height:44px;border:1px solid #5b4767;border-radius:10px;background:#21172b;color:#fff;padding:9px;font:inherit}button{font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#e84f9a,#8568df)}.danger{color:#ff9bab}.status{color:#85efc9;font-size:.83rem;min-height:1.2em;margin-top:8px}.note{color:#bbaec1;font-size:.8rem;line-height:1.45}</style></head>
<body><main><header><a href="../app-home/index.html">‹</a><h1 data-i18n="settings">Preferencias</h1></header>
<section class="card"><h2>IDIOMA Y APARIENCIA</h2>
<label>Idioma<select id="language"><option value="es">Español</option><option value="en">English</option><option value="pt">Português</option></select></label>
<label>Tema visual<select id="theme"><option value="pop">Pop violeta</option><option value="pastel">Pastel</option><option value="cinema">Cine</option><option value="neutral">Neutro</option></select></label></section>
<section class="card"><h2>PROYECTOS NUEVOS</h2>
<label>Formato predeterminado<select id="format"><option value="horizontal">Horizontal · 16:9</option><option value="vertical">Vertical · 9:16</option><option value="square">Cuadrado · 1:1</option></select></label>
<label><span>Volumen del audio guía · <b id="volText">80%</b></span><input id="guideVolume" type="range" min="0" max="100" value="80"></label>
<label style="display:flex;align-items:center;gap:9px"><input id="subtitles" type="checkbox" style="width:22px;min-height:22px">Crear pista de subtítulos en proyectos nuevos</label>
<button id="save" class="primary">Guardar preferencias</button><div class="status" id="status"></div></section>
<section class="card"><h2>DATOS LOCALES</h2><p class="note">Los proyectos, favoritos y preferencias de estos prototipos se guardan únicamente en este navegador.</p><button id="clear" class="danger">Borrar datos locales de Uizador</button></section>
</main><script type="module">
import{getPrefs,savePrefs,applyLanguage}from'../../../core/i18n.js';const $=s=>document.querySelector(s),p=getPrefs();['language','theme','format'].forEach(k=>$('#'+k).value=p[k]);$('#subtitles').checked=p.subtitles;$('#guideVolume').value=p.guideVolume;$('#volText').textContent=p.guideVolume+'%';applyLanguage();$('#guideVolume').oninput=()=>$('#volText').textContent=$('#guideVolume').value+'%';$('#save').onclick=()=>{savePrefs({language:$('#language').value,theme:$('#theme').value,format:$('#format').value,subtitles:$('#subtitles').checked,guideVolume:+$('#guideVolume').value});applyLanguage();$('#status').textContent='Preferencias guardadas.'};$('#clear').onclick=()=>{if(confirm('¿Borrar proyectos, favoritos y preferencias guardadas en este navegador?')){Object.keys(localStorage).filter(k=>k.startsWith('uizador-')).forEach(k=>localStorage.removeItem(k));location.reload()}};
</script></body></html>
